workflows:
  simulator-build:
    name: Build iOS Simulator for Appetize
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build iOS Simulator
        script: flutter build ios --simulator
      - name: Package app for Appetize.io
        script: |
          cd build/ios/iphonesimulator
          zip -r ../../../ios_simulator.zip *.app
    artifacts:
      - ios_simulator.zip